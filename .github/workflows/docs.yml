name: Docs

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: the interfaces are current
        run: |
          moon info --target native
          git -c core.autocrlf=false diff --ignore-cr-at-eol --exit-code -- src/

      # The reference is generated from the interfaces, so a page that does not
      # match the sources is a page that was not regenerated. Fail before deploying.
      - name: the reference and the search index are generated from the sources
        run: |
          python scripts/docs/gen_api.py
          python scripts/docs/gen_search.py
          git -c core.autocrlf=false diff --exit-code -- docs/

      - name: the site agrees with the sources
        run: python scripts/docs/check_docs.py

      - name: every snippet on the pages compiles
        run: python scripts/docs/check_page_snippets.py

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
