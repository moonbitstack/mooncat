name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: openssl headers (ubuntu)
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: install moon (unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install moon (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          Add-Content -Path $env:GITHUB_PATH -Value "$HOME\.moon\bin" -Encoding utf8

      - name: post install
        run: |
          moon version --all
          moon update

      - name: the documentation pages match the interfaces
        run: python scripts/docs/check_docs.py

      - name: no test picks the port it listens on
        run: python scripts/checks/check_ports.py

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      # A reader pastes the blocks of the README and the skills into a project, so they have
      # to compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py

      - name: the code in the pages compiles
        if: runner.os == 'Linux'
        run: python3 scripts/docs/check_page_snippets.py

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            if grep -q 'kind: "executable"' "$dir/moon.pkg" && ! grep -q 'supported_targets = "js"' "$dir/moon.pkg"; then
              timeout 30 moon run "$dir" --target native > /dev/null || [ $? -eq 124 ]
            fi
          done

      - name: workers, with real processes
        if: runner.os == 'Linux'
        run: |
          moon build --target native
          bash scripts/checks/check_workers.sh

      - name: TLS resumption with Python's ssl
        if: runner.os == 'Linux'
        run: |
          moon build src/examples/14-http2-server --target native
          python3 scripts/checks/check_tls_resume.py

      - name: HTTP/3 against another implementation
        if: runner.os == 'Linux'
        run: |
          moon build src/examples/07-http3 --target native
          python3 -m venv "$RUNNER_TEMP/aioquic"
          "$RUNNER_TEMP/aioquic/bin/pip" install --quiet aioquic
          "$RUNNER_TEMP/aioquic/bin/python" scripts/http3/check_http3.py

      - name: HTTP/3 conformance, h3spec 0.1.14
        if: runner.os == 'Linux'
        run: sh scripts/http3/check_h3spec.sh

      # One process, many connections: a hundred one after another, and a burst beside a
      # connection that stays open across it.
      - name: HTTP/3 connections, many in one process
        if: runner.os == 'Linux'
        run: |
          moon build src/examples/07-http3 --target native
          "$RUNNER_TEMP/aioquic/bin/python" scripts/http3/check_connections.py

      # RFC 8470: a request that arrived in 0-RTT is marked, refused with 425 when the policy
      # says so, and not offered at all when it is off.
      - name: HTTP over 0-RTT against aioquic
        if: runner.os == 'Linux'
        run: |
          moon build src/examples/15-early-data --target native
          "$RUNNER_TEMP/aioquic/bin/python" scripts/http3/check_zero_rtt.py

      # The cases the QUIC interoperability runner names, driven directly so that no Docker is
      # needed; the image and the descriptor it would use are in scripts/interop.
      - name: QUIC interoperability matrix
        if: runner.os == 'Linux'
        run: |
          moon build src/examples/16-interop-server --target native
          "$RUNNER_TEMP/aioquic/bin/python" scripts/interop/check_matrix.py

      - name: QUIC against aioquic, both ways
        if: runner.os == 'Linux'
        run: |
          moon build src/examples/12-quic-echo src/examples/13-quic-client --target native
          "$RUNNER_TEMP/aioquic/bin/python" scripts/quic/check_interop.py

      - name: HTTP/3 under workers, with real processes
        if: runner.os == 'Linux'
        run: |
          moon build src/examples/08-workers --target native
          "$RUNNER_TEMP/aioquic/bin/python" scripts/checks/check_workers_http3.py

      - name: lint (fmt is clean)
        run: |
          moon fmt && git -c core.autocrlf=false diff --ignore-cr-at-eol --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git -c core.autocrlf=false diff --ignore-cr-at-eol --exit-code

  # Autobahn's fuzzingclient against the echo endpoint: framing, fragments, UTF-8, close handling,
  # limits and permessage-deflate. A job of its own because it needs Docker.
  conformance:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: autobahn
        run: sh scripts/autobahn/run.sh

      - name: h2spec
        run: sh scripts/http2/check_h2spec.sh
